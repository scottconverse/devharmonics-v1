name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run release-truth checks and the full suite
        run: npm run check
        # Windows runner defaults can expose the same directory once as an 8.3
        # path and once as its long path, defeating security-sensitive
        # containment comparisons. The runner context supplies one spelling.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  randomized-order:
    name: Randomized test-file order
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run every test file in seeded shuffled order
        run: npm run test:randomized -- --seed "${{ github.run_id }}-${{ github.run_attempt }}"

  mutation-discipline:
    name: Mutation discipline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prove the verification-integrity sentinel can fail
        run: npm run test:mutation

  validator-discovery-corpus:
    name: Frozen CivicSuite authority corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Provision exact detached corpus checkouts
        run: node scripts/provision-validator-discovery-corpus.mjs "$RUNNER_TEMP/validator-discovery-corpus"
      - name: Run the default frozen-corpus verifier
        run: CIVICSUITE_ORG_READALL="$RUNNER_TEMP/validator-discovery-corpus" npm run verify:validator-discovery-corpus
      - name: Verify immutable release authority
        run: CIVICSUITE_ORG_READALL="$RUNNER_TEMP/validator-discovery-corpus" npm run verify:version-authority-corpus
      - name: Verify immutable dependency intelligence
        run: CIVICSUITE_ORG_READALL="$RUNNER_TEMP/validator-discovery-corpus" npm run verify:dependency-intelligence-corpus

  validator-browser:
    name: Validator allowlist browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Install the pinned Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Build the dashboard
        run: npm run build
      - name: Exercise the validator allowlist in Chromium
        run: npm run test:browser
      - name: Prove validator discovery imports in a production-pruned install
        run: |
          npm prune --omit=dev
          node -e "import('./dist/src/validator-discovery.js').then(m => { if (typeof m.discoverRepositoryValidators !== 'function') process.exit(1) })"
